<svg width="680" height="384" viewBox="0 0 680 384" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<title>ESP32 3-axis gimbal wiring diagram</title>
<rect x="0" y="0" width="680" height="384" fill="#ffffff"/>

<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
<path d="M2 1L8 5L2 9" fill="none" stroke="#555555" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
</marker>
</defs>

<line x1="230" y1="68" x2="450" y2="68" stroke="#555555" stroke-width="1.5" marker-end="url(#arrow)"/>
<path d="M140 96 L140 130 L340 130 L340 160" fill="none" stroke="#555555" stroke-width="1.5" marker-end="url(#arrow)"/>
<line x1="205" y1="188" x2="230" y2="188" stroke="#b35c00" stroke-width="1.5" marker-end="url(#arrow)"/>
<path d="M340 216 L340 240 L110 240 L110 300" fill="none" stroke="#a33f1d" stroke-width="1.5" marker-end="url(#arrow)"/>
<line x1="340" y1="216" x2="340" y2="300" stroke="#a33f1d" stroke-width="1.5" marker-end="url(#arrow)"/>
<path d="M340 216 L340 260 L570 260 L570 300" fill="none" stroke="#a33f1d" stroke-width="1.5" marker-end="url(#arrow)"/>

<g>
<rect x="50" y="40" width="180" height="56" rx="8" fill="#e3f0fd" stroke="#2f6fb3" stroke-width="1.5"/>
<text x="140" y="62" text-anchor="middle" font-size="15" font-weight="600" fill="#1a3f66">ESP32 devkit</text>
<text x="140" y="82" text-anchor="middle" font-size="12" fill="#1a3f66">I2C: GPIO21/22</text>
</g>

<g>
<rect x="450" y="40" width="180" height="56" rx="8" fill="#e1f5f2" stroke="#1f8a76" stroke-width="1.5"/>
<text x="540" y="62" text-anchor="middle" font-size="15" font-weight="600" fill="#0e4a3f">MPU6050 IMU</text>
<text x="540" y="82" text-anchor="middle" font-size="12" fill="#0e4a3f">I2C addr 0x68</text>
</g>

<g>
<rect x="40" y="160" width="165" height="56" rx="8" fill="#fdf0dc" stroke="#b35c00" stroke-width="1.5"/>
<text x="122" y="182" text-anchor="middle" font-size="14" font-weight="600" fill="#7a3d00">External power</text>
<text x="122" y="202" text-anchor="middle" font-size="12" fill="#7a3d00">5-6V for servos</text>
</g>

<g>
<rect x="230" y="160" width="220" height="56" rx="8" fill="#efe6fb" stroke="#6a3fa0" stroke-width="1.5"/>
<text x="340" y="182" text-anchor="middle" font-size="15" font-weight="600" fill="#3d1f66">PCA9685 driver</text>
<text x="340" y="202" text-anchor="middle" font-size="12" fill="#3d1f66">I2C addr 0x40, 50Hz</text>
</g>

<g>
<rect x="40" y="300" width="140" height="44" rx="8" fill="#fbe4dd" stroke="#a33f1d" stroke-width="1.5"/>
<text x="110" y="318" text-anchor="middle" font-size="14" font-weight="600" fill="#6b2811">Yaw servo</text>
<text x="110" y="335" text-anchor="middle" font-size="12" fill="#6b2811">PCA9685 ch 0</text>
</g>

<g>
<rect x="270" y="300" width="140" height="44" rx="8" fill="#fbe4dd" stroke="#a33f1d" stroke-width="1.5"/>
<text x="340" y="318" text-anchor="middle" font-size="14" font-weight="600" fill="#6b2811">Pitch servo</text>
<text x="340" y="335" text-anchor="middle" font-size="12" fill="#6b2811">PCA9685 ch 1</text>
</g>

<g>
<rect x="500" y="300" width="140" height="44" rx="8" fill="#fbe4dd" stroke="#a33f1d" stroke-width="1.5"/>
<text x="570" y="318" text-anchor="middle" font-size="14" font-weight="600" fill="#6b2811">Roll servo</text>
<text x="570" y="335" text-anchor="middle" font-size="12" fill="#6b2811">PCA9685 ch 2</text>
</g>
</svg>
